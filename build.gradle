plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.8.0"
}

group 'cn.ncii.lottie'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.26.0')
    compileOnly 'run.halo.app:api'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.register('processUiResources', Sync) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
    // Vite emits content-hashed files. Always clear the previous generation
    // before syncing so stale chunks cannot remain inside the plugin JAR.
    outputs.upToDateWhen { false }
    doFirst {
        delete(layout.buildDirectory.dir('resources/main/ui'))
    }
}

// Halo's UI provider keeps the canonical bundle under `ui/`, while the
// plugin asset endpoint is backed by the ReverseProxy `static/` directory on
// some 2.26 installations. Mirror the complete generated directory there so
// /plugins/lottie/assets/ui/** works with both resource handlers.
tasks.register('processUiStaticResources', Sync) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/static/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
    outputs.upToDateWhen { false }
    doFirst {
        delete(layout.buildDirectory.dir('resources/main/static/ui'))
    }
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
    dependsOn tasks.named('processUiStaticResources')
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.26'
}
