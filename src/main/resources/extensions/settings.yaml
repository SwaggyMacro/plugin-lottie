apiVersion: v1alpha1
kind: Setting
metadata:
  name: lottie-settings
spec:
  forms:
    - group: general
      label: 通用设置
      formSchema:
        - $formkit: number
          name: maxCompressedMb
          label: ZIP 压缩包大小上限（MB）
          value: 50
          min: 1
          max: 500
        - $formkit: number
          name: maxExpandedMb
          label: 解压大小上限（MB）
          value: 200
          min: 1
          max: 1000
        - $formkit: number
          name: maxFiles
          label: ZIP 文件数量上限
          value: 200
          min: 1
          max: 10000
        - $formkit: number
          name: maxRecentItems
          label: 最近使用最多保留数量
          help: 插入对话框中记录的最近使用动画数量，修改后对所有设备生效。
          value: 50
          min: 1
          max: 500
        - $formkit: checkbox
          name: readAnimationDimensions
          label: 从动画文件读取默认宽高
          help: 优先使用动画文件中的宽高属性；读取失败时使用下方默认值。
          value: false
        - $formkit: number
          name: defaultWidth
          label: 默认宽度（px）
          value: 160
          min: 1
          max: 4096
        - $formkit: number
          name: defaultHeight
          label: 默认高度（px）
          value: 160
          min: 1
          max: 4096
    - group: skeleton
      label: 骨架屏
      formSchema:
        - $formkit: switch
          name: skeletonEnabled
          label: 启用骨架屏
          value: true
        - $formkit: switch
          name: skeletonLoaderEnabled
          label: 显示加载器
          value: true
        - $formkit: switch
          name: skeletonBackgroundEnabled
          label: 显示背景
          value: true
        - $formkit: color
          name: skeletonBackgroundColor
          label: 背景颜色
          value: "#f3f4f6"
        - $formkit: switch
          name: skeletonBorderEnabled
          label: 显示边框
          value: true
        - $formkit: color
          name: skeletonBorderColor
          label: 边框颜色
          value: "#d7dbe0"
        - $formkit: color
          name: skeletonAccentColor
          label: 加载指示器颜色
          value: "#6b7280"
        - $formkit: number
          name: skeletonBorderRadius
          label: 圆角（px）
          value: 8
          min: 0
          max: 64
        - $formkit: number
          name: skeletonBackgroundOpacity
          label: 背景透明度（%）
          value: 100
          min: 0
          max: 100
